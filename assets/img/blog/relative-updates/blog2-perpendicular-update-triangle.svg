<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 35 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">沿负梯度的垂直更新构成直角三角形</title>
  <desc id="desc">原权重 w 水平向右，当前梯度 g 在旧权重端点竖直向上。沿负梯度的更新 Δw 竖直向下。原点、旧权重端点、新权重端点构成直角三角形，原点处的夹角为 θ，邻边长度为 ‖w‖，对边长度为 ‖Δw‖。</desc>
  <defs>
    <marker id="blue" markerWidth="13" markerHeight="13" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#2864b4"/></marker>
    <marker id="green" markerWidth="13" markerHeight="13" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#137b63"/></marker>
    <marker id="orange" markerWidth="13" markerHeight="13" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#b65a14"/></marker>
    <marker id="purple" markerWidth="13" markerHeight="13" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#8055ab"/></marker>
    <style>
      text{font-family:'PingFang SC','Arial',sans-serif;fill:#243346;}
      .label{font-size:28px;}
      .math{font-family:'Times New Roman','STIX Two Math',serif;font-size:37px;font-style:italic;}
    </style>
  </defs>
  <rect x="0" y="35" width="1200" height="590" fill="#fff"/>
  <line x1="100" y1="200" x2="850" y2="200" stroke="#d6dfe8" stroke-width="2"/>
  <line x1="100" y1="200" x2="800" y2="200" stroke="#2864b4" stroke-width="4.5" marker-end="url(#blue)"/>
  <line x1="100" y1="200" x2="800" y2="500" stroke="#137b63" stroke-width="4.5" marker-end="url(#green)"/>
  <line x1="800" y1="200" x2="800" y2="80" stroke="#8055ab" stroke-width="4.5" marker-end="url(#purple)"/>
  <line x1="800" y1="200" x2="800" y2="500" stroke="#b65a14" stroke-width="5" marker-end="url(#orange)"/>
  <path d="M778,200 L778,222 L800,222" stroke="#64748b" stroke-width="2.5" fill="none"/>
  <path d="M230,200 A130,130 0 0 1 219.49,251.21" stroke="#64748b" stroke-width="2.5" fill="none"/>
  <circle cx="100" cy="200" r="5" fill="#243346"/>
  <circle cx="800" cy="200" r="5" fill="#2864b4"/>
  <circle cx="800" cy="500" r="5" fill="#137b63"/>
  <text x="40" y="255" class="label">原点</text>
  <text x="447" y="163" class="math" style="fill:#2864b4">w</text>
  <text x="415" y="244" class="math">‖w‖</text>
  <text x="845" y="113" class="math" style="fill:#8055ab">g</text>
  <text x="845" y="340" class="math" style="fill:#b65a14">Δw</text>
  <text x="845" y="392" class="math">‖Δw‖</text>
  <text x="825" y="540" class="math" style="fill:#137b63">w + Δw</text>
  <text x="260" y="257" class="math">θ</text>
</svg>
